# Nginx Configuration for fat2.mkstudio.click
# Place in /etc/nginx/sites-available/fat2.mkstudio.click

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name fat2.mkstudio.click;

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    return 301 https://$server_name$request_uri;
}

# HTTPS server - Proxy to 3x-ui panel
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fat2.mkstudio.click;

    ssl_certificate /etc/letsencrypt/live/fat2.mkstudio.click/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fat2.mkstudio.click/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Proxy all requests to 3x-ui panel (typically runs on port 2053)
    # Update the port if your 3x-ui uses a different port
    location / {
        proxy_pass http://127.0.0.1:2053;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }
}

