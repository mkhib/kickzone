<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Customer Portal</title>
    <!-- TODO: For dynamic site name/i18n, set title using translation key for site name on server or via JS at runtime. -->
    <base href="/" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/src/styles.css" />
    <style>
      @keyframes goldPulse {
        0% {
          opacity: 0;
          transform: scale(1);
        }
        4% {
          opacity: 0.3;
          transform: scale(1.02);
        }
        7% {
          opacity: 0;
          transform: scale(1);
        }
        100% {
          opacity: 0;
          transform: scale(1);
        }
      }

      html,
      body {
        background: #ffffff;
        min-height: 100vh;
        margin: 0;
        padding: 0;
        position: relative;
      }

      body::before {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
              420px 420px at 20% 20%,
              rgba(198, 165, 85, 0.1),
              transparent 60%
            ),
          radial-gradient(
              360px 360px at 80% 12%,
              rgba(198, 165, 85, 0.08),
              transparent 58%
            ),
          radial-gradient(
              300px 300px at 55% 75%,
              rgba(198, 165, 85, 0.06),
              transparent 60%
            );
        mix-blend-mode: soft-light;
        opacity: 0;
        animation: goldPulse 14s ease-in-out infinite;
        z-index: 0;
      }

      #root {
        position: relative;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
