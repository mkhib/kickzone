name: Build and Deploy

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch: # Allows manual triggering

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build API
        run: yarn nx build kickzone-api --configuration=production

      - name: Build Admin Panel
        run: yarn nx build kickzone-admins --configuration=production

      - name: Build Seller Panel
        run: yarn nx build kickzone-sellers --configuration=production

      - name: Build Customer Panel
        run: yarn nx build kickzone-customers --configuration=production

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            dist/apps/kickzone-api
            dist/apps/client
          retention-days: 7

