name: Build and Deploy

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build API
        run: yarn nx build kickzone-api --configuration=production

      - name: Build Admin Panel
        run: yarn nx build kickzone-admins --configuration=production

      - name: Build Seller Panel
        run: yarn nx build kickzone-sellers --configuration=production

      - name: Build Customer Panel
        run: yarn nx build kickzone-customers --configuration=production

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            dist/apps/kickzone-api
            dist/apps/client
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: dist/apps

      - name: Deploy API to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "dist/apps/kickzone-api/*"
          target: "/opt/masterskey/apps/kickzone-api/"
          strip_components: 0
          overwrite: true

      - name: Deploy frontends to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "dist/apps/client/*"
          target: "/var/www/masterskey/dist/apps/client/"
          strip_components: 0
          overwrite: true

      - name: Restart services on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            PROJECT_DIR="/opt/masterskey"
            API_DIR="/opt/masterskey/apps/kickzone-api"
            API_SERVICE="masterskey-api"

            if [ -f "$PROJECT_DIR/deployment-scripts/remote-post-deploy.sh" ]; then
              bash "$PROJECT_DIR/deployment-scripts/remote-post-deploy.sh"
            else
              sudo chown -R www-data:www-data "$API_DIR" /var/www/masterskey
              sudo chmod -R 755 "$API_DIR" /var/www/masterskey
              if [ -f "$PROJECT_DIR/package.json" ] && [ -f "$PROJECT_DIR/yarn.lock" ]; then
                cd "$PROJECT_DIR"
                sudo -u deployuser yarn install --production --ignore-scripts || true
              fi
              sudo systemctl restart "$API_SERVICE"
              sudo nginx -t
              sudo systemctl reload nginx
            fi
