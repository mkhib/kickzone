name: kickzone_cl

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#npx-nxcloud-startcirun
      # Uncomment this line to enable task distribution
      # - run: yarn nx-cloud start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="build"

      # Cache node_modules
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Install dependencies
        run: |
          for i in 1 2 3 4 5; do
            yarn install --frozen-lockfile && exit 0
            echo "yarn install failed (attempt $i), retrying in 20s..."
            sleep 20
          done
          echo "yarn install failed after retries"
          exit 1

      - uses: nrwl/nx-set-shas@v4

      # Prepend any command with "nx-cloud record --" to record its logs to Nx Cloud
      # - run: yarn nx-cloud record -- echo Hello World
      # Nx Affected runs only tasks affected by the changes in this PR/commit. Learn more: https://nx.dev/ci/features/affected
      - run: yarn nx affected -t lint test build

      - name: Install Playwright Chromium
        run: yarn playwright install --with-deps chromium

      - name: Run affected Playwright e2e (Chromium)
        run: yarn nx affected -t e2e --exclude=kickzone-api-e2e
